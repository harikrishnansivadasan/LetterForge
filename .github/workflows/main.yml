name: Deploy LetterForge to EC2

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Docker Login
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build and Push Docker Image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: ${{ secrets.DOCKER_USERNAME }}/letterforge:latest
        platforms: linux/amd64

    - name: Add SSH Key
      run: |
        echo "${{ secrets.EC2_SSH_KEY_B64 }}" | base64 -d > key.pem
        chmod 600 key.pem

    - name: Deploy on EC2
      run: |
        ssh -o StrictHostKeyChecking=no -i key.pem ubuntu@${{ secrets.EC2_PUBLIC_IP }} << 'EOF'
          mkdir -p ~/letterforge-deploy
          cd ~/letterforge-deploy
          
          docker pull ${{ secrets.DOCKER_USERNAME }}/letterforge:latest

          docker stop letterforge || true
          docker rm letterforge || true

          echo "GROQ_API_KEY=${{ secrets.GROQ_API_KEY }}" > .env
          echo "RAPIDAPI_KEY=${{ secrets.RAPIDAPI_KEY }}" >> .env
          echo "ADZUNA_APP_ID=${{ secrets.ADZUNA_APP_ID }}" >> .env
          echo "ADZUNA_APP_KEY=${{ secrets.ADZUNA_APP_KEY }}" >> .env
          
          docker run -d \
            --env-file .env \
            -v ~/letterforge-deploy/.env:/app/.env \
            -p 8501:8501 \
            --name letterforge \
            ${{ secrets.DOCKER_USERNAME }}/letterforge:latest
            
        EOF
